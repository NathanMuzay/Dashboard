# Included inside nginx's http context. Separate limits protect expensive auth calls.
limit_req_zone $binary_remote_addr zone=lumi_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lumi_auth:10m rate=10r/m;

server {
    listen 80;
    server_tokens off;
    # The proxy emits these headers once; the direct API still protects itself.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_status 429;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://*.scdn.co https://*.spotifycdn.com https://*.googleusercontent.com https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://gmail.googleapis.com https://api.github.com https://api.spotify.com https://accounts.spotify.com https://api.open-meteo.com https://geocoding-api.open-meteo.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location /api/auth/ {
        limit_req zone=lumi_auth burst=10 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location = /api/ai/ask {
        limit_req zone=lumi_api burst=5 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 305s;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
    location /api/ {
        limit_req zone=lumi_api burst=30 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
    location = /about.json {
        proxy_pass http://backend:3001;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
